name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Lint + Test + Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: judou
          POSTGRES_PASSWORD: judou
          POSTGRES_DB: judou
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U judou -d judou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://judou:judou@localhost:5432/judou
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest, 真实数据库)
        run: pytest -q

      - name: Build backend image
        run: docker build -t judou-backend:ci .

  compose:
    name: Compose config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f deploy/docker-compose.yml config -q
