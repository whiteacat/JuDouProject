[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "judou-backend"
version = "0.1.0"
description = "群组聚餐组队微信小程序 - 后端服务"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "geoalchemy2>=0.15,<1.0",
    "shapely>=2.0,<3.0",
    "PyJWT>=2.8,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 共享同一事件循环，避免 asyncpg 连接池跨循环复用报错
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI Depends 属于刻意用法
    "UP045", # py3.9 + SQLAlchemy：Mapped[Optional[X]] 不能改写为 X | None（其 resolver 无法解析）
]
